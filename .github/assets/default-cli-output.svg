<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="860" viewBox="0 0 1380 860" role="img" aria-labelledby="title desc">
  <title id="title">Default CLI lifecycle output in every lint mode</title>
  <desc id="desc">Representative colored terminal output for successful and failed lint, lint plus type check, and type-check-only runs.</desc>
  <rect width="1280" height="860" rx="16" fill="#0d1117"/>

  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="60" y="52" fill="#f0f6fc" font-size="25" font-weight="700">Default CLI lifecycle output</text>
    <text x="60" y="80" fill="#8b949e" font-size="15">Captured from the built CLI with one thread; durations vary by run.</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="14">
    <g transform="translate(60 104)">
      <rect width="1260" height="226" rx="10" fill="#161b22" stroke="#30363d"/>
      <circle cx="20" cy="20" r="5" fill="#ff5f56"/>
      <circle cx="38" cy="20" r="5" fill="#ffbd2e"/>
      <circle cx="56" cy="20" r="5" fill="#27c93f"/>
      <text x="82" y="25" fill="#f0f6fc" font-weight="700">Lint</text>
      <text x="132" y="25" fill="#8b949e">rslint &lt;file&gt;</text>

      <text x="25" y="68" fill="#3fb950" font-size="12" font-weight="700">PASS</text>
      <text x="90" y="68" xml:space="preserve"><tspan fill="#39c5cf" font-weight="700">start</tspan><tspan fill="#c9d1d9">   Linting...</tspan></text>
      <text x="90" y="96" xml:space="preserve"><tspan fill="#3fb950" font-weight="700">success</tspan><tspan fill="#c9d1d9"> Lint passed in 41ms </tspan><tspan fill="#6e7681">(1 file, 2 rules, 1 thread)</tspan></text>

      <line x1="25" y1="120" x2="1235" y2="120" stroke="#30363d"/>
      <text x="25" y="153" fill="#f85149" font-size="12" font-weight="700">FAIL</text>
      <text x="90" y="153" xml:space="preserve"><tspan fill="#39c5cf" font-weight="700">start</tspan><tspan fill="#c9d1d9">   Linting...</tspan></text>
      <text x="90" y="181" fill="#6e7681">⋮ diagnostics</text>
      <text x="90" y="209" xml:space="preserve"><tspan fill="#f85149" font-weight="700">error</tspan><tspan fill="#c9d1d9">   Lint failed with 1 error and 1 warning in 50ms </tspan><tspan fill="#6e7681">(1 file, 2 rules, 1 thread)</tspan></text>
    </g>

    <g transform="translate(60 350)">
      <rect width="1260" height="226" rx="10" fill="#161b22" stroke="#30363d"/>
      <circle cx="20" cy="20" r="5" fill="#ff5f56"/>
      <circle cx="38" cy="20" r="5" fill="#ffbd2e"/>
      <circle cx="56" cy="20" r="5" fill="#27c93f"/>
      <text x="82" y="25" fill="#f0f6fc" font-weight="700">Lint + type check</text>
      <text x="235" y="25" fill="#8b949e">rslint --type-check &lt;file&gt;</text>

      <text x="25" y="68" fill="#3fb950" font-size="12" font-weight="700">PASS</text>
      <text x="90" y="68" xml:space="preserve"><tspan fill="#39c5cf" font-weight="700">start</tspan><tspan fill="#c9d1d9">   Linting and type checking...</tspan></text>
      <text x="90" y="96" xml:space="preserve"><tspan fill="#3fb950" font-weight="700">success</tspan><tspan fill="#c9d1d9"> Lint and type check passed in 152ms </tspan><tspan fill="#6e7681">(1 file, 2 rules, 1 thread)</tspan></text>

      <line x1="25" y1="120" x2="1235" y2="120" stroke="#30363d"/>
      <text x="25" y="153" fill="#f85149" font-size="12" font-weight="700">FAIL</text>
      <text x="90" y="153" xml:space="preserve"><tspan fill="#39c5cf" font-weight="700">start</tspan><tspan fill="#c9d1d9">   Linting and type checking...</tspan></text>
      <text x="90" y="181" fill="#6e7681">⋮ diagnostics</text>
      <text x="25" y="209" font-size="10.5" xml:space="preserve"><tspan fill="#f85149" font-weight="700">error</tspan><tspan fill="#c9d1d9">   Lint and type check failed with 1 lint error, 1 TypeScript error, and 1 warning in 149ms </tspan><tspan fill="#6e7681">(1 file, 2 rules, 1 thread)</tspan></text>
    </g>

    <g transform="translate(60 596)">
      <rect width="1260" height="226" rx="10" fill="#161b22" stroke="#30363d"/>
      <circle cx="20" cy="20" r="5" fill="#ff5f56"/>
      <circle cx="38" cy="20" r="5" fill="#ffbd2e"/>
      <circle cx="56" cy="20" r="5" fill="#27c93f"/>
      <text x="82" y="25" fill="#f0f6fc" font-weight="700">Type check only</text>
      <text x="218" y="25" fill="#8b949e">rslint --type-check-only &lt;file&gt;</text>

      <text x="25" y="68" fill="#3fb950" font-size="12" font-weight="700">PASS</text>
      <text x="90" y="68" xml:space="preserve"><tspan fill="#39c5cf" font-weight="700">start</tspan><tspan fill="#c9d1d9">   Type checking...</tspan></text>
      <text x="90" y="96" xml:space="preserve"><tspan fill="#3fb950" font-weight="700">success</tspan><tspan fill="#c9d1d9"> Type check passed in 157ms </tspan><tspan fill="#6e7681">(1 file, 1 thread)</tspan></text>

      <line x1="25" y1="120" x2="1235" y2="120" stroke="#30363d"/>
      <text x="25" y="153" fill="#f85149" font-size="12" font-weight="700">FAIL</text>
      <text x="90" y="153" xml:space="preserve"><tspan fill="#39c5cf" font-weight="700">start</tspan><tspan fill="#c9d1d9">   Type checking...</tspan></text>
      <text x="90" y="181" fill="#6e7681">⋮ diagnostics</text>
      <text x="90" y="209" xml:space="preserve"><tspan fill="#f85149" font-weight="700">error</tspan><tspan fill="#c9d1d9">   Type check failed with 1 TypeScript error in 150ms </tspan><tspan fill="#6e7681">(1 file, 1 thread)</tspan></text>
    </g>
  </g>
</svg>
