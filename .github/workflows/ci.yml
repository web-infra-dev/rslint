name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  static:
    name: Format and spelling
    runs-on: rspack-ubuntu-22.04-large
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Node.js
        uses: ./.github/actions/setup-node
      - name: Format
        run: pnpm format:check
      - name: Check spelling
        run: pnpm check-spell
      - name: Verify build plans
        run: node --test scripts/tsrs/build-rust.test.mjs

  test-rust-js:
    name: Rust and JS (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    env:
      CARGO_BUILD_JOBS: 2
      CI: true
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Node.js
        uses: ./.github/actions/setup-node
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Lint Rust core and addon
        run: cargo --config node_modules/.cache/rslint-rust-compiler/cargo-config.toml clippy --locked -p rslint-core -p rslint-native --all-targets -- -D warnings
      - name: Test lint core and Node addon
        run: node scripts/tsrs/build-rust.mjs --test
      - name: Build Rust addon and public JavaScript
        run: pnpm build
      - name: Select the built native addon
        shell: bash
        run: |
          node --input-type=module -e 'import {createBuildPlan} from "./scripts/tsrs/build-rust.mjs"; console.log("RSLINT_NATIVE_BINDING=" + createBuildPlan({}).destination)' >> "$GITHUB_ENV"
      - name: Test native addon
        run: node --test crates/rslint-native/tests/rust-lint.test.mjs
      - name: Test configuration, admission, CLI and API
        run: pnpm --filter @rslint/core test:rust
      # Legacy editor, browser, plugin-worker and semantic-service suites are
      # not compatible with the direct Rust backend yet. They are not reported
      # as passing by these native CLI/API checks.

  done:
    name: CI Done
    needs: [static, test-rust-js]
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - name: Require all selected checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const jobs = JSON.parse(process.env.RESULTS); if (Object.values(jobs).some(job => job.result !== "success")) process.exit(1)'
