name: 🚀 Release packages

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to release'
        required: true
        default: 'main'
      dry_run:
        type: boolean
        description: 'Run the workflow in dry-run mode'
        required: false
        default: false
      npm_tag:
        type: choice
        description: 'Specify npm tag'
        required: true
        default: 'alpha'
        options:
          - alpha
          - beta
          - rc
          - canary
          - latest
      extension_type:
        type: choice
        description: 'Specify the release type of extension'
        required: true
        default: pre-release
        options:
          - official
          - pre-release

      to_release:
        description: 'Packages to release'
        type: choice
        required: true
        options:
          - all
          - npm
          - extension
permissions:
  contents: read

jobs:
  resolve-revision:
    name: Resolve immutable release revision
    runs-on: ubuntu-22.04
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - name: Checkout requested branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          ref: ${{ github.event.inputs.branch }}

      - name: Record release commit
        id: revision
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish-npm:
    if: ${{ inputs.to_release == 'all' || inputs.to_release == 'npm' }}
    name: ${{ inputs.dry_run == true && 'Dry Run - NPM Packages' || 'Publish NPM Packages' }}
    needs: [resolve-revision, build, napi-build]
    runs-on: ubuntu-22.04
    environment: release
    permissions:
      # For push git tags
      contents: write
      # For Trusted Publish
      id-token: write
    steps:
      - name: Show dry-run status
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "🏃‍♂️ RUNNING IN DRY-RUN MODE - No packages will be published to npm registry"
            echo "=================================================="
          else
            echo "🚀 LIVE MODE - Packages will be published to npm registry"
            echo "========================================"
          fi

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          ref: ${{ needs.resolve-revision.outputs.sha }}
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      # Update npm to the latest version to enable OIDC
      - name: Update npm
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: binaries

      - name: Move binaries
        uses: ./.github/actions/move-artifacts
      # The per-platform .node parser binaries ship in the @rslint/native-{tuple}
      # subpackages, populated from the napi-build artifacts by move-artifacts
      # above. core's loader resolves them at runtime, so no napi build / Rust is
      # needed here — build:js just bundles the worker (loader + types live in core).
      - name: Build @rslint/core dist
        run: pnpm --filter @rslint/core build:js
      - name: Publish npm packages
        if: ${{ inputs.dry_run == false }}
        run: |
          pnpm -r publish --no-git-checks --tag ${{ github.event.inputs.npm_tag }} --publish-branch ${{ github.event.inputs.branch }}
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions"
          version=$(jq -r .version package.json)
          git tag v$version -m "v$version"
          git push origin v$version

  package-extension:
    # Extension-only releases must not wait for native matrices. Combined
    # releases, however, publish the editor only after npm succeeds so users
    # can install the core runtime the new extension expects.
    needs: [resolve-revision, publish-npm]
    if: ${{ always() && needs.resolve-revision.result == 'success' && (inputs.to_release == 'extension' || (inputs.to_release == 'all' && needs.publish-npm.result == 'success')) }}
    name: Package universal editor extension
    runs-on: rspack-ubuntu-22.04-large
    outputs:
      sha: ${{ steps.packaged-revision.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          ref: ${{ needs.resolve-revision.outputs.sha }}
          submodules: true

      - name: Record packaged revision
        id: packaged-revision
        env:
          RELEASE_REVISION: ${{ needs.resolve-revision.outputs.sha }}
        run: echo "sha=$RELEASE_REVISION" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Build and validate the universal VSIX
        run: |
          if [ "${{ inputs.extension_type }}" = "pre-release" ]; then
            pnpm publish:vsce --prerelease --dry-run
          else
            pnpm publish:vsce --dry-run
          fi
      - name: Upload universal VSIX
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rslint-extension-vsix
          path: packages/vscode-extension/rslint-*.vsix
          if-no-files-found: error

  publish-extension-vscode:
    needs: [package-extension]
    name: ${{ inputs.dry_run == true && 'Dry Run - VS Code Marketplace' || 'Publish VS Code Marketplace' }}
    runs-on: rspack-ubuntu-22.04-large
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          ref: ${{ needs.package-extension.outputs.sha }}
          submodules: true

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Download universal VSIX
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rslint-extension-vsix
          path: packages/vscode-extension

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.RSLINT_VSCE_PAT }}
        run: |
          flags="--skip-package"
          if [ "${{ inputs.extension_type }}" = "pre-release" ]; then
            flags="$flags --prerelease"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            flags="$flags --dry-run"
          fi
          pnpm publish:vsce $flags

  publish-extension-open-vsx:
    needs: [package-extension]
    name: ${{ inputs.dry_run == true && 'Dry Run - Open VSX Registry' || 'Publish Open VSX Registry' }}
    runs-on: rspack-ubuntu-22.04-large
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          ref: ${{ needs.package-extension.outputs.sha }}
          submodules: true

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Download universal VSIX
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rslint-extension-vsix
          path: packages/vscode-extension

      - name: Publish to Open VSX Registry
        env:
          OVSX_PAT: ${{ secrets.RSLINT_OVSX_PAT }}
        run: |
          flags="--skip-package"
          if [ "${{ inputs.extension_type }}" = "pre-release" ]; then
            flags="$flags --prerelease"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            flags="$flags --dry-run"
          fi
          pnpm publish:ovsx $flags

  build:
    needs: [resolve-revision]
    if: ${{ inputs.to_release == 'all' || inputs.to_release == 'npm' }}
    env:
      GOMAXPROCS: 8
    name: Build-Binaries
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
            node_arch: x64
            node_os: darwin
          - goos: darwin
            goarch: arm64
            node_arch: arm64
            node_os: darwin
          - goos: linux
            goarch: amd64
            node_arch: x64
            node_os: linux
          - goos: linux
            goarch: arm64
            node_arch: arm64
            node_os: linux
          - goos: windows
            goarch: amd64
            node_arch: x64
            node_os: win32
          - goos: windows
            goarch: arm64
            node_arch: arm64
            node_os: win32
    runs-on: rspack-ubuntu-22.04-large
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          ref: ${{ needs.resolve-revision.outputs.sha }}
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Setup Go
        uses: ./.github/actions/setup-go
        with:
          go-version: 1.26.0
          cache-name: ${{ matrix.node_os }}-${{ matrix.node_arch }}

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Install pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Go Build rslint
        run: |
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -ldflags="-s -w" -o ${{ matrix.node_os }}-${{ matrix.node_arch }}-rslint ./cmd/rslint

      - name: Go Build tsgo
        run: |
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -ldflags="-s -w" -o ${{ matrix.node_os }}-${{ matrix.node_arch }}-tsgo ./cmd/tsgo

      - name: Upload rslint artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.node_os }}-${{ matrix.node_arch }}-rslint
          path: ${{ matrix.node_os }}-${{ matrix.node_arch }}-rslint

      - name: Upload tsgo artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.node_os }}-${{ matrix.node_arch }}-tsgo
          path: ${{ matrix.node_os }}-${{ matrix.node_arch }}-tsgo

      - name: Build typescript-go
        run: |
          cd typescript-go
          npm ci
          npm run build
          # Remove tsgo binary from typescript-go build, we use our own ./cmd/tsgo build
          rm -f built/local/tsgo built/local/tsgo.exe

      - name: Upload typescript-go built artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.node_os }}-${{ matrix.node_arch }}-tsgo-built
          path: typescript-go/built

  # napi `.node` parser binaries, one per target → the @rslint/native-{tuple}
  # subpackages. Separate matrix from the Go build job (which is ubuntu-only):
  # napi win32-msvc/darwin need native runners since zig and
  # @napi-rs/cross-toolchain can't target windows-msvc. Each leg uploads a
  # uniquely-named artifact (`native-{tuple}` — upload-artifact@v4 rejects
  # dupes); move-artifacts matches the `rslint.` filename prefix. gnu cross
  # legs use --use-napi-cross (@napi-rs/cross-toolchain, gnu-only); musl uses
  # -x (cargo-zigbuild) since cross-toolchain has no musl sysroot.
  napi-build:
    needs: [resolve-revision]
    if: ${{ inputs.to_release == 'all' || inputs.to_release == 'npm' }}
    name: Build napi (${{ matrix.settings.target }})
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: aarch64-apple-darwin
            artifact: native-darwin-arm64
          - host: macos-latest
            target: x86_64-apple-darwin
            artifact: native-darwin-x64
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: native-win32-x64-msvc
          - host: windows-latest
            target: aarch64-pc-windows-msvc
            artifact: native-win32-arm64-msvc
          - host: rspack-ubuntu-22.04-large
            target: x86_64-unknown-linux-gnu
            artifact: native-linux-x64-gnu
          - host: rspack-ubuntu-22.04-large
            target: aarch64-unknown-linux-gnu
            artifact: native-linux-arm64-gnu
            cross: '--use-napi-cross'
          - host: rspack-ubuntu-22.04-large
            target: x86_64-unknown-linux-musl
            artifact: native-linux-x64-musl
            cross: '-x'
          - host: rspack-ubuntu-22.04-large
            target: aarch64-unknown-linux-musl
            artifact: native-linux-arm64-musl
            cross: '-x'
    runs-on: ${{ matrix.settings.host }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          ref: ${{ needs.resolve-revision.outputs.sha }}
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Install pnpm
        run: corepack enable

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.settings.target }}
          cache-key: ${{ matrix.settings.target }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # musl legs cross-compile via cargo-zigbuild (napi -x); zig must be on
      # PATH (@napi-rs/cli auto-installs cargo-zigbuild when missing, but not
      # zig itself).
      - name: Setup zig (musl cross-compile)
        if: ${{ contains(matrix.settings.target, 'musl') }}
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2

      - name: Build napi
        run: pnpm --filter @rslint/native exec napi build --platform --release --no-js --target ${{ matrix.settings.target }} ${{ matrix.settings.cross || '' }}

      - name: Upload napi artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.settings.artifact }}
          path: crates/rslint-native/rslint.*.node
          if-no-files-found: error
