name: Build native npm packages
# cspell:ignore mlugg

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch or commit to build
        required: true
        default: main
      dry_run:
        description: Only package locally; publishing remains disabled during migration
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  resolve-release:
    name: Freeze package source
    runs-on: ubuntu-22.04
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.branch }}
      - name: Reject publication until migration acceptance
        if: ${{ !inputs.dry_run }}
        run: |
          echo '::error::Publishing is unsupported while Rust backend compatibility is under review. This workflow builds npm tarballs only.'
          exit 1
      - name: Freeze commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-native:
    name: Build ${{ matrix.tuple }}
    needs: resolve-release
    runs-on: ${{ matrix.host }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: macos-latest
            tuple: darwin-arm64
            target: aarch64-apple-darwin
          - host: macos-latest
            tuple: darwin-x64
            target: x86_64-apple-darwin
          - host: windows-latest
            tuple: win32-x64-msvc
            target: x86_64-pc-windows-msvc
          - host: windows-latest
            tuple: win32-arm64-msvc
            target: aarch64-pc-windows-msvc
          - host: ubuntu-22.04
            tuple: linux-x64-gnu
            target: x86_64-unknown-linux-gnu
            zig: x86_64-linux-gnu.2.28
          - host: ubuntu-22.04
            tuple: linux-arm64-gnu
            target: aarch64-unknown-linux-gnu
            zig: aarch64-linux-gnu.2.28
          - host: ubuntu-22.04
            tuple: linux-x64-musl
            target: x86_64-unknown-linux-musl
            zig: x86_64-linux-musl
          - host: ubuntu-22.04
            tuple: linux-arm64-musl
            target: aarch64-unknown-linux-musl
            zig: aarch64-linux-musl
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - name: Checkout frozen source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.resolve-release.outputs.sha }}
      - name: Setup Node.js
        uses: ./.github/actions/setup-node
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
          cache-key: ${{ matrix.target }}
      - name: Setup Linux cross linker
        if: ${{ matrix.zig != '' }}
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
      - name: Configure Linux target linker
        if: ${{ matrix.zig != '' }}
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.target }}
          ZIG_TARGET: ${{ matrix.zig }}
        run: |
          mkdir -p target/ci-linkers
          linker="$PWD/target/ci-linkers/zig-linker"
          printf '#!/bin/sh\nexec "%s" cc -target "%s" "$@"\n' "$(command -v zig)" "$ZIG_TARGET" > "$linker"
          chmod +x "$linker"
          target_key=$(echo "$RUST_TARGET" | tr '[:lower:]-' '[:upper:]_')
          echo "CARGO_TARGET_${target_key}_LINKER=$linker" >> "$GITHUB_ENV"
          if [[ "$RUST_TARGET" == *-musl ]]; then
            echo "CARGO_TARGET_${target_key}_RUSTFLAGS=-C target-feature=-crt-static" >> "$GITHUB_ENV"
          fi
      - name: Build direct Rust addon
        run: node scripts/tsrs/build-rust.mjs --platform ${{ matrix.tuple }}
      - name: Upload native addon
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.tuple }}
          path: npm/rslint/${{ matrix.tuple }}/rslint.${{ matrix.tuple }}.node
          if-no-files-found: error

  package-npm:
    name: Assemble native CLI and API tarballs
    needs: [resolve-release, build-native]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout frozen source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.resolve-release.outputs.sha }}
      - name: Setup Node.js
        uses: ./.github/actions/setup-node
      - name: Download native addons
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: native-*
          path: binaries
      - name: Assemble platform packages
        uses: ./.github/actions/move-artifacts
      - name: Build public JavaScript
        run: |
          pnpm --filter @rslint/api build
          pnpm --filter @rslint/core build:js
      - name: Pack CLI, API and native packages
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/npm-tarballs"
          pnpm --filter @rslint/core --filter @rslint/api --filter '@rslint/native-*' -r pack --pack-destination "$RUNNER_TEMP/npm-tarballs"
      - name: Upload npm tarballs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-npm-tarballs
          path: ${{ runner.temp }}/npm-tarballs/*.tgz
          if-no-files-found: error
# Browser, editor and semantic-service packages are intentionally absent. Their
# old process-based release pipelines do not establish direct Rust compatibility.
