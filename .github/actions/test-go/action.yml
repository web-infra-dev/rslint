name: Test Go
description: Resolve affected Go packages and run tests on Linux, Windows, and Darwin

inputs:
  go-version:
    description: Go version to test
    required: true
  mode:
    description: 'Requested Go test scope: affected or full'
    required: true
  changed-files:
    description: Newline-separated candidate Go input files
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Disable CPU hogs (Windows)
      if: runner.os == 'Windows'
      continue-on-error: true
      uses: ./.github/actions/windows-disable-cpu-hogs
    - name: Setup Node
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: '24'
    - name: Setup Go
      uses: ./.github/actions/setup-go
      with:
        go-version: ${{ inputs.go-version }}
        cache-name: ci-test-go
    - name: Select Go test packages
      id: selection
      shell: bash
      env:
        GO_TEST_MODE: ${{ inputs.mode }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        targets="$RUNNER_TEMP/go-test-packages.txt"
        changed="$RUNNER_TEMP/go-changed-inputs.txt"
        metadata="$RUNNER_TEMP/go-test-metadata.txt"
        # Keep potentially large file lists out of the process environment.
        cat > "$changed" <<'GO_CHANGED_FILES'
        ${{ inputs.changed-files }}
        GO_CHANGED_FILES
        mode=full
        if [[ "$GO_TEST_MODE" == affected ]] && [[ -n $(cat "$changed") ]]; then
          # Keep Go's native package, test dependency and embed metadata intact.
          if go list -test -json ./cmd/... ./internal/... > "$metadata" &&
             go run "$ACTION_PATH/select_packages.go" "$changed" "$metadata" > "$targets"; then
            if [[ -s "$targets" ]]; then mode=affected; else mode=skip; fi
          else
            echo 'Changed files could not be mapped to the suite; running the full Go suite.'
          fi
        fi
        # Windows limits command lines to 32,767 characters; leave room for flags.
        if [[ "$RUNNER_OS" == Windows && "$mode" == affected && $(wc -c < "$targets") -gt 30000 ]]; then
          echo 'Selected package list is too long for Windows; running the full Go suite.'
          mode=full
        fi
        if [[ "$mode" == full ]]; then
          printf '%s\n' ./cmd/... ./internal/... > "$targets"
        fi
        rm -f "$changed" "$metadata"
        echo "mode=$mode" >> "$GITHUB_OUTPUT"
        echo "Go tests: $mode"
        cat "$targets"

    - name: Verify compiler shim layout
      if: steps.selection.outputs.mode == 'full'
      shell: bash
      run: go test github.com/microsoft/TypeScript/tsc/shim/checker

    - name: Unit Test (Linux / Darwin)
      if: runner.os != 'Windows' && steps.selection.outputs.mode != 'skip'
      shell: bash
      run: |
        if [[ "$RUNNER_OS" == Linux ]]; then export GOMAXPROCS=16; fi
        packages=()
        while IFS= read -r package; do
          packages+=("$package")
        done < "$RUNNER_TEMP/go-test-packages.txt"
        if [[ ${#packages[@]} -eq 0 ]]; then
          echo 'No Go packages selected for testing.' >&2
          exit 1
        fi
        go test -count=1 "${packages[@]}"

    - name: Unit Test (Windows)
      if: runner.os == 'Windows' && steps.selection.outputs.mode != 'skip'
      shell: pwsh
      env:
        # Honor full-suite fallbacks from package selection.
        GO_TEST_MODE: ${{ steps.selection.outputs.mode }}
        ACTION_PATH: ${{ github.action_path }}
        # Keep the existing default concurrency when runner quotas are unavailable.
        GOMAXPROCS: 16
      run: |
        $targets = @(Get-Content (Join-Path $env:RUNNER_TEMP 'go-test-packages.txt'))
        if ($targets.Count -eq 0) { throw 'No Go packages selected for testing.' }

        # Windows linkers preload object files into private memory. Test
        # executables do not need DWARF; omit it in dependency objects too.
        $compilerArgs = @('-gcflags=all=-dwarf=false')
        $parallelArgs = @()
        $packageParallelism = [int]$env:GOMAXPROCS
        $cpuLimit = 0
        if ([int]::TryParse($env:cpu_limit, [ref]$cpuLimit) -and $cpuLimit -gt 0) {
          $packageParallelism = $cpuLimit
          $env:GOMAXPROCS = "$packageParallelism"
          $parallelArgs = @("-p=$packageParallelism")
        } elseif ($env:cpu_limit) {
          Write-Warning "Ignoring invalid cpu_limit; keeping GOMAXPROCS=$env:GOMAXPROCS."
        }

        $testParallelism = $packageParallelism
        $testParallelArgs = $parallelArgs
        $memoryLimitGiB = 0
        if ([int]::TryParse($env:memory_Limit, [ref]$memoryLimitGiB) -and $memoryLimitGiB -gt 0) {
          # memory_Limit is the runner's total memory quota in GiB.
          # Reserve 10% for the OS and other overhead, and share the budget
          # across the full CPU-quota package parallelism.
          $memoryBudgetMiB = [Math]::Floor($memoryLimitGiB * 1024 * 0.9)

          # GOMEMLIMIT is a soft limit for each Go process, not the whole job.
          # Keep the CPU-based divisor so reducing test concurrency does not
          # increase each process's memory budget.
          $processMemoryMiB = [Math]::Floor($memoryBudgetMiB / $packageParallelism)
          $env:GOMEMLIMIT = "${processMemoryMiB}MiB"

          # Use a 6 GiB estimate per concurrent test build or test binary for
          # compiler/linker peaks above the soft Go memory limit.
          $testParallelism = [Math]::Max(1, [Math]::Min($packageParallelism, [Math]::Floor($memoryBudgetMiB / 6144)))
          $testParallelArgs = @("-p=$testParallelism")
        } elseif ($env:memory_Limit) {
          Write-Warning "Ignoring invalid memory_Limit; keeping the existing memory settings."
        }

        Write-Host ("Runner quotas: " + (@{cpu_limit = $env:cpu_limit; memory_Limit = $env:memory_Limit} | ConvertTo-Json -Compress))
        Write-Host "Go limits: GOMAXPROCS=$env:GOMAXPROCS, build parallelism=$packageParallelism, test parallelism=$testParallelism, GOMEMLIMIT=$env:GOMEMLIMIT"
        Write-Host "Go compiler flags: $($compilerArgs -join ' ')"
        $memoryLog = Join-Path $env:RUNNER_TEMP 'windows-go-memory.jsonl'
        $memoryStop = Join-Path $env:RUNNER_TEMP 'windows-go-memory.stop'
        Remove-Item $memoryLog, $memoryStop -ErrorAction SilentlyContinue
        $memoryJob = Start-Job -FilePath (Join-Path $env:ACTION_PATH 'windows-memory.ps1') -ArgumentList $memoryLog, $memoryStop, $PID
        try {
          if ($env:GO_TEST_MODE -eq 'affected') {
            go test @compilerArgs @testParallelArgs -count=1 @targets
            exit $LASTEXITCODE
          }

          $startedAt = [DateTime]::UtcNow
          go build @compilerArgs @parallelArgs @targets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Go build completed: elapsed_seconds=$([int]([DateTime]::UtcNow - $startedAt).TotalSeconds)"

          $packages = @(go list @compilerArgs @parallelArgs @targets | Where-Object { $_ -ne "" })
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($packages.Count -eq 0) { throw 'No Go packages found for the full test run.' }
          Write-Host "Running all $($packages.Count) packages..."
          # Pass the original patterns to stay within Windows command-line limits.
          go test @compilerArgs @testParallelArgs -count=1 @targets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Go tests completed: packages=$($packages.Count), elapsed_seconds=$([int]([DateTime]::UtcNow - $startedAt).TotalSeconds)"
        } finally {
          New-Item -ItemType File -Path $memoryStop -Force | Out-Null
          $memoryJob | Wait-Job -Timeout 10 | Out-Null
          if ($memoryJob.State -eq 'Running') { $memoryJob | Stop-Job }
          $memoryJob | Receive-Job -ErrorAction Continue
          $memoryJob | Remove-Job -Force
          if (Test-Path $memoryLog) {
            # The artifact keeps every sample; print only the final summary.
            Write-Host "Windows memory telemetry: $(Get-Content $memoryLog -Tail 1)"
          }
        }

    - name: Upload Windows memory diagnostics
      if: always() && runner.os == 'Windows' && steps.selection.outputs.mode != 'skip'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: windows-go-memory-${{ github.run_attempt }}-${{ inputs.go-version }}
        path: ${{ runner.temp }}/windows-go-memory.jsonl
        retention-days: 7
