# yaml-language-server: $schema=https://golangci-lint.run/jsonschema/golangci.jsonschema.json

version: '2'

run:
  allow-parallel-runners: true

linters:
  default: none
  enable:
    - asasalint
    - bidichk
    - bodyclose
    - canonicalheader
    - copyloopvar
    - depguard
    - durationcheck
    - errchkjson
    - errname
    - errorlint
    - fatcontext
    - forbidigo
    - forcetypeassert
    - gocheckcompilerdirectives
    - goprintffuncname
    - govet
    - grouper
    - inamedparam
    - ineffassign
    - intrange
    - makezero
    - mirror
    - misspell
    - musttag
    - nakedret
    - nilerr
    - nilnesserr
    - nilnil
    - perfsprint
    - predeclared
    - reassign
    - staticcheck
    - testableexamples
    - tparallel
    - unconvert
    - unused
    - usestdlibvars
    - usetesting

  settings:
    govet:
      enable:
        - nilness
    forbidigo:
      forbid:
        - pattern: '^strings\.ToLower$'
          msg: 'Use ecmascript.StringToLowerCase instead.'
        - pattern: '^strings\.ToUpper$'
          msg: 'Use ecmascript.StringToUpperCase instead.'
        - pattern: '^strings\.TrimSpace$'
          msg: 'Use ecmascript.StringTrim instead.'
        - pattern: '^strings\.EqualFold$'
          msg: 'Use ecmascript.EqualsWhenUppercased or ecmascript.EqualsWhenLowercased instead.'
        - pattern: '^unicode\.To(Upper|Lower|Title)?$'
          msg: 'Use ecmascript.StringToUpperCase or ecmascript.StringToLowerCase instead.'
        - pattern: '^unicode\.SimpleFold$'
          msg: 'Use esregexp.Canonicalize or esregexp.CaseEquivalents instead.'
        - pattern: '^unicode\.IsSpace$'
          msg: 'Use ecmascript.IsWhiteSpaceOrLineTerminator instead.'
    depguard:
      rules:
        js-semantics:
          list-mode: lax
          files:
            - '**/internal/rules/**'
            - '**/internal/plugins/**'
            - '**/internal/utils/**'
            - '!**/internal/utils/ecmascript/**'
            - '!**/internal/utils/minimatch3/**'
          deny:
            - pkg: 'github.com/dlclark/regexp2'
              desc: 'A pattern a rule is handed was written as a JavaScript regexp. Use "github.com/web-infra-dev/rslint/internal/utils/ecmascript/regexp" instead.'
            - pkg: 'github.com/bmatcuk/doublestar'
              desc: 'A glob a rule is handed is read the way minimatch 3 reads one. Use "github.com/web-infra-dev/rslint/internal/utils/minimatch3" instead.'

  exclusions:
    rules:
      - path: internal/fourslash/tests/gen/
        linters:
          - misspell
      - path: '_test\.go$'
        linters:
          - forcetypeassert
      - path-except: '^internal/(rules|plugins|utils)/'
        linters:
          - forbidigo
      - path: '^internal/utils/(ecmascript|minimatch3)/'
        linters:
          - forbidigo
      - path: '_test\.go$'
        linters:
          - forbidigo

    presets:
      - comments
      - std-error-handling

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
  exclusions:
    paths:
      - internal/fourslash/tests/gen
