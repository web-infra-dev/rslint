# yaml-language-server: $schema=https://golangci-lint.run/jsonschema/golangci.jsonschema.json

version: '2'

run:
  allow-parallel-runners: true

linters:
  default: none
  disable:
    - errcheck
    - paralleltest
  enable:
    # Enabled
    - asasalint
    - bidichk
    - bodyclose
    - canonicalheader
    - copyloopvar
    - depguard
    - durationcheck
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - fatcontext
    - forbidigo
    - forcetypeassert
    - gocheckcompilerdirectives
    - goprintffuncname
    - govet
    - grouper
    - inamedparam
    - ineffassign
    - intrange
    - makezero
    - mirror
    - misspell
    - musttag
    - nakedret
    - nilerr
    - nilnesserr
    - nilnil
    # - nolintlint
    - paralleltest
    - perfsprint
    - predeclared
    - reassign
    - testableexamples
    - tparallel
    - unconvert
    - usestdlibvars
    - usetesting

    # Need to add headers
    # - goheader

    # Check
    # - exhaustive
    # - gocritic
    # - gosec
    # - revive
    - staticcheck
    # - testifylint
    # - unparam
    - unused

  settings:
    govet:
      enable:
        - nilness
    forbidigo:
      forbid:
        - pattern: '^strings\.ToLower$'
          msg: 'A string a rule lowercases is lowercased the way JavaScript lowercases it. Use ecmascript.StringToLowerCase, which is the same answer for ASCII and the right one past it.'
        - pattern: '^strings\.ToUpper$'
          msg: 'A string a rule uppercases is uppercased the way JavaScript uppercases it. Use ecmascript.StringToUpperCase, which grows the string where JavaScript grows it.'
        - pattern: '^strings\.TrimSpace$'
          msg: 'The whitespace a rule trims is what JavaScript trims: ECMAScript WhiteSpace plus LineTerminator. Use ecmascript.StringTrim.'
    depguard:
      rules:
        js-semantics:
          # Lax so that the allow list below reads as an exception to a deny
          # rather than as the only thing a rule may import.
          list-mode: lax
          files:
            - '**/internal/rules/**'
            - '**/internal/plugins/**'
          allow:
            # depguard matches an import by prefix, and the deny below would
            # otherwise take this with it.
            - 'unicode/utf8'
          deny:
            - pkg: 'unicode'
              desc: 'A character a rule reads is read the way JavaScript reads it, not the way Go does. Use "github.com/web-infra-dev/rslint/internal/utils/ecmascript" for case and whitespace, "github.com/web-infra-dev/rslint/internal/utils/unicode17" for a general category, and "github.com/microsoft/typescript-go/shim/scanner" for an identifier.'
            - pkg: 'github.com/dlclark/regexp2'
              desc: 'A pattern a rule is handed was written as a JavaScript regexp. Use "github.com/web-infra-dev/rslint/internal/utils/ecmascript/regexp" instead.'
            - pkg: 'github.com/bmatcuk/doublestar'
              desc: 'A glob a rule is handed is read the way minimatch 3 reads one. Use "github.com/web-infra-dev/rslint/internal/utils/minimatch3" instead.'

  exclusions:
    rules:
      - path: internal/fourslash/tests/gen/
        linters:
          - misspell
      - path: '_test\.go$'
        linters:
          - forcetypeassert
      # A rule reproduces JavaScript; everything else here is a linter written
      # in Go, answering Go's questions with Go's standard library.
      - path-except: '^internal/(rules|plugins)/'
        linters:
          - forbidigo
      # Test scaffolding builds its own strings rather than reading a source
      # file, so it is not asking the question the rule asks.
      - path: '_test\.go$'
        linters:
          - forbidigo

    presets:
      - comments
      - std-error-handling

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
