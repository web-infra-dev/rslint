[package]
name = "rslint-native"
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
# Built only into the isolated native addon used by the worker termination test.
test-worker-termination = []

[dependencies]
napi = "3.12.1"
napi-derive = "3.5.6"
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Memory"] }

[build-dependencies]
napi-build = "2.3.2"
