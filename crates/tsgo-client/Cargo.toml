# cspell:ignore thiserror bitflags insta
[package]
name = "tsgo-client"
version = "0.0.15"
edition = "2024"
description = "TypeScript Go client library"
license = "MIT"

[dependencies]
thiserror = "2.0.21"
serde = { version = "1.0.229", features = [ "derive" ] }
cbor4ii = {version = "1.2.3", features = ["serde1"]}
serde_bytes = "0.11.19"
bitflags = { version = "2.13.2"}

[dev-dependencies]
insta = { version = "1.48.0", features = ["json"] }
serde_json = "1.0.151"
tempfile = "3"
