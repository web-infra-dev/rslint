[package]
name = "rslint-core"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
num-bigint = "=0.4.6"
num-traits = "=0.2.19"
oxc_regular_expression = "=0.154.0"
oxc_allocator = "=0.154.0"
oxc_span = "=0.154.0"
# Preserve Unicode 15 grapheme behavior of the frozen rule's uniseg dependency.
# A separate source permits this alongside the addon's newer miette dependency.
unicode-segmentation-v15 = { package = "unicode-segmentation", git = "https://github.com/unicode-rs/unicode-segmentation.git", rev = "d02ab6e5d14f009cde8c152ef19dcb55d0b594fc" }
tsrs_api = { git = "https://github.com/oxc-project/tsrs.git", rev = "280b426b89cd4ecd6153cf48228826bd60a99c61" }
tsrs_ast = { git = "https://github.com/oxc-project/tsrs.git", rev = "280b426b89cd4ecd6153cf48228826bd60a99c61" }
tsrs_binder = { git = "https://github.com/oxc-project/tsrs.git", rev = "280b426b89cd4ecd6153cf48228826bd60a99c61" }
tsrs_checker = { git = "https://github.com/oxc-project/tsrs.git", rev = "280b426b89cd4ecd6153cf48228826bd60a99c61" }
tsrs_compiler = { git = "https://github.com/oxc-project/tsrs.git", rev = "280b426b89cd4ecd6153cf48228826bd60a99c61" }
tsrs_contentmapper = { git = "https://github.com/oxc-project/tsrs.git", rev = "280b426b89cd4ecd6153cf48228826bd60a99c61" }
tsrs_diagnostics = { git = "https://github.com/oxc-project/tsrs.git", rev = "280b426b89cd4ecd6153cf48228826bd60a99c61" }
tsrs_core = { git = "https://github.com/oxc-project/tsrs.git", rev = "280b426b89cd4ecd6153cf48228826bd60a99c61" }
tsrs_project = { git = "https://github.com/oxc-project/tsrs.git", rev = "280b426b89cd4ecd6153cf48228826bd60a99c61" }
tsrs_scanner = { git = "https://github.com/oxc-project/tsrs.git", rev = "280b426b89cd4ecd6153cf48228826bd60a99c61" }
tsrs_tsoptions = { git = "https://github.com/oxc-project/tsrs.git", rev = "280b426b89cd4ecd6153cf48228826bd60a99c61" }
tsrs_vfs = { git = "https://github.com/oxc-project/tsrs.git", rev = "280b426b89cd4ecd6153cf48228826bd60a99c61" }

tsrs_parser = { git = "https://github.com/oxc-project/tsrs.git", rev = "280b426b89cd4ecd6153cf48228826bd60a99c61" }
